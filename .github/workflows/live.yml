name: live-agent
# The agent, unattended, every day through judging (scripts/live-agent.mjs). Its key is in this repo's
# secrets on purpose: Invoice Leash assumes the agent's key leaks, so it runs it where it could, with a
# decider that obeys every email. The run log is committed (runs/live/log.jsonl, hash-chained, signed).
# Three jobs, so the agent's host never holds the agent signer's ML-DSA-87 key: plan (agent host) ->
# sign (the signer's own job, GitHub Environment "agent-signer", its key only) -> relay (agent host).
# The agent's jobs' secrets alone give the agent's classical key and no signer: on InvoiceDeskV4 that
# pays nothing (BadAgentSignature).
on:
  schedule:
    - cron: "10 1 * * *" # 01:10 UTC: just after the desk's UTC day starts
    # GitHub may drop a scheduled run under load (it did on 2026-11-25), so two more chances a day; a run
    # for a day already in the log does nothing (scripts/live-agent.mjs).
    - cron: "47 4 * * *"
    - cron: "23 9 * * *"
    # GitHub starts scheduled runs late or not at all under load (2026-11-25: the 09:23 run started at 19:26;
    # 2026-11-26: none by 05:00). More chances a day; a day already logged does nothing (about a minute)
    - cron: "37 3,7,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-agent
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the agent host's keys (testnet only; no signer key)
        env:
          AGENTKEM: ${{ secrets.LEASH_AGENTKEM }}
          VENDOR: ${{ secrets.LEASH_VENDOR }}
        run: |
          umask 077 && mkdir -p "$HOME/leash"
          printf 'agentkem=%s\nvendor="%s"\n' "$AGENTKEM" "$VENDOR" > "$HOME/leash/keys.env"
      - name: today's mail and the decider's plan
        env:
          PHASE: plan
          LEASH_DIR: /home/runner/leash
          LEASH_WORK: /home/runner/work-live
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/live-agent.mjs && rm -f "$HOME/leash/keys.env"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: /home/runner/work-live/
          if-no-files-found: ignore
          retention-days: 1

  sign:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: agent-signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /home/runner/work-live/
        continue-on-error: true
      - name: the signer's key only
        env:
          AGENTSIGNER: ${{ secrets.LEASH_AGENTSIGNER }}
        run: |
          umask 077 && mkdir -p "$HOME/leash"
          printf 'agentsigner="%s"\n' "$AGENTSIGNER" > "$HOME/leash/keys.env"
      - name: sign the agent's payments for this desk, payer and agent
        env:
          PHASE: sign
          LEASH_DIR: /home/runner/leash
          LEASH_WORK: /home/runner/work-live
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/live-agent.mjs && rm -f "$HOME/leash/keys.env"
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: /home/runner/work-live/signatures.json
          if-no-files-found: ignore
          # the repository is public, and so are its artifacts: the agent signatures live one day, not ninety
          retention-days: 1

  relay:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /home/runner/work-live/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: signatures
          path: /home/runner/work-live/
        continue-on-error: true
      - name: the agent host's keys (testnet only; no signer key)
        env:
          GAS: ${{ secrets.LEASH_GAS }}
          AGENT: ${{ secrets.LEASH_AGENT }}
        run: |
          umask 077 && mkdir -p "$HOME/leash"
          printf 'gas="%s"\nagent=%s\n' "$GAS" "$AGENT" > "$HOME/leash/keys.env"
      - name: today's attempts, through the leash
        # one attempt only: a retry could send twice (the script refuses a second run for a logged day)
        env:
          PHASE: relay
          LEASH_DIR: /home/runner/leash
          LEASH_WORK: /home/runner/work-live
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node scripts/live-agent.mjs
      - name: publish the log and the site
        if: always()
        run: |
          rm -f "$HOME/leash/keys.env"
          node scripts/site.mjs && node scripts/app.mjs
          git config user.name "invoice-leash live agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/live docs/index.html docs/app-data.json
          git diff --cached --quiet && exit 0
          git commit -m "live agent: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
