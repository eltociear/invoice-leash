name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # daily: the testnet state the README claims, re-checked
  workflow_dispatch:

# read-only: CI checks, it never writes to the repository
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build/ matches the contract source
        run: npm run compile && git diff --exit-code build/
      - name: ML-DSA-87 fixtures reproduce byte for byte (deterministic signing)
        run: npm run fixtures && git diff --exit-code test/fixtures/
      - name: offline invoice signatures (ML-DSA-87), page scripts parse
        run: npm test
      - name: docs/ pages match the scripts and recorded runs
        run: node scripts/site.mjs && node scripts/lab.mjs && node scripts/lab-v1.mjs && node scripts/app.mjs && git diff --exit-code docs/
      - uses: foundry-rs/foundry-toolchain@v1
      - name: contract tests (Foundry, fuzzed; PQC precompile stand-in answers from real ML-DSA-87)
        run: forge test -vv
      - name: symbolic proofs (Halmos) for InvoiceDeskV3 and V4, the signature check stubbed to accept anything
        run: |
          pip install --quiet halmos==0.3.3
          mkdir -p out && ln -sfn . out/contracts   # halmos 0.3.3 looks for out/contracts/<file>/<name>.json
          FOUNDRY_OUT=out FOUNDRY_CACHE_PATH=cache-halmos halmos --contract InvoiceDeskV3Halmos
          FOUNDRY_OUT=out FOUNDRY_CACHE_PATH=cache-halmos halmos --contract InvoiceDeskV4Halmos
      - name: every README claim against the live qorechain-diana testnet (read-only, no keys)
        # a public testnet flakes; a real failure fails all three tries
        run: for i in 1 2 3; do npm run verify && exit 0; echo "attempt $i failed, retrying in 60 s"; sleep 60; done; exit 1

  node20:
    # the README says Node.js 20+: the offline tests on the oldest supported version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
